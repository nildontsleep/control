<!doctype html>
<html lang="fr" data-theme="dark">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0c0c0f">
  <title>Installation — control</title>
  <link rel="icon" href="/assets/icon.png">
  <link rel="stylesheet" href="/styles/base.css">
  <link rel="stylesheet" href="/styles/controls.css">
  <link rel="stylesheet" href="/styles/app.css">
  <link rel="stylesheet" href="/web/web.css">
</head>
<body>
  <div class="web-bg" aria-hidden="true"><i></i><i></i><i></i></div>
  <main class="card wide">
    <div class="brand">
      <img src="/assets/icon.png" alt="">
      <div><h1>Bienvenue</h1><span>Quelques réglages pour démarrer le serveur</span></div>
    </div>
    <form id="form" autocomplete="off">
      <label class="field"><span>Nom du serveur</span><input class="text-input" id="serverName" value="control" maxlength="60" required></label>
      <label class="field"><span>Dossier de musique sur le serveur</span><input class="text-input" id="folder" placeholder="/music" spellcheck="false"></label>
      <p class="hint">Chemin du dossier tel que le serveur le voit (dans Docker : le dossier monté, par exemple <code>/music</code>). Vous pourrez en ajouter d’autres ensuite.</p>
      <label class="field"><span>Compte administrateur</span><input class="text-input" id="username" name="username" placeholder="Nom (3 à 24 caractères)" autocomplete="username" autocapitalize="none" spellcheck="false" required></label>
      <input class="text-input" id="password" name="password" type="password" placeholder="Mot de passe (8 caractères minimum)" autocomplete="new-password" required>
      <input class="text-input" id="password2" type="password" placeholder="Confirmer le mot de passe" autocomplete="new-password" required>
      <label class="field" id="tokenField" hidden><span>Code d’installation</span><input class="text-input" id="token" spellcheck="false"></label>
      <label class="field"><span>Clé TMDB (facultatif, pour les films et séries)</span><input class="text-input" id="tmdb" spellcheck="false" placeholder="Clé d’API v3"></label>
      <p class="error" id="error" role="alert"></p>
      <button class="btn btn-primary" id="submit" type="submit">Créer le serveur</button>
    </form>
  </main>
  <script src="/web/setup.js"></script>
</body>
</html>
