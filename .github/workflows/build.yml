name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'

jobs:
  # Tests de tout l'espace de travail (noyau, moteur audio, application, serveur) et clippy.
  test:
    name: Tests et clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev ffmpeg

      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Tests
        run: cargo test --workspace

      - name: Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Démarrage de l'application sans fenêtre : la bibliothèque, les vues et les réglages se construisent.
      - name: Rendu de démarrage
        run: |
          mkdir -p "$RUNNER_TEMP/smoke"
          CONTROL_NO_AUDIO=1 CONTROL_DATA="$RUNNER_TEMP/smoke" target/debug/control --snap "$RUNNER_TEMP/smoke.png" --size 1360x860 --at 1 --scale 1
          for scene in albums settings nowplaying; do
            CONTROL_NO_AUDIO=1 CONTROL_DATA="$RUNNER_TEMP/smoke" target/debug/control --snap "$RUNNER_TEMP/$scene.png" --scene $scene --size 1360x860 --at 1 --scale 1
          done

  windows:
    name: Windows — portable + installateur
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6

      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup show active-toolchain; if ($LASTEXITCODE -ne 0) { rustup toolchain install }

      - uses: Swatinem/rust-cache@v2

      - name: Construire
        run: cargo build --release -p control

      - name: Version
        id: version
        shell: bash
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | python -c 'import json,sys; print(next(p["version"] for p in json.load(sys.stdin)["packages"] if p["name"]=="control"))')" >> "$GITHUB_OUTPUT"

      - name: Portable et installateur
        shell: bash
        run: |
          mkdir -p dist
          cp target/release/control.exe "dist/control-${{ steps.version.outputs.version }}-portable.exe"
          cd packaging/windows
          makensis -DVERSION=${{ steps.version.outputs.version }} -DEXE="$GITHUB_WORKSPACE\\target\\release\\control.exe" -DOUT="$GITHUB_WORKSPACE\\dist\\control-${{ steps.version.outputs.version }}-setup.exe" installer.nsi

      - name: Envoyer la version portable
        uses: actions/upload-artifact@v6
        with:
          name: control-portable
          path: dist/*-portable.exe
          if-no-files-found: error

      - name: Envoyer l’installateur
        uses: actions/upload-artifact@v6
        with:
          name: control-installateur
          path: dist/*-setup.exe
          if-no-files-found: error

  linux:
    name: Linux — AppImage + deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Dépendances système
        run: sudo apt-get update && sudo apt-get install -y libxkbcommon-dev libwayland-dev libasound2-dev libfuse2

      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Construire
        run: cargo build --release -p control

      - name: Version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="control") | .version')" >> "$GITHUB_OUTPUT"

      - name: Paquet deb
        run: |
          cargo install cargo-deb --locked
          mkdir -p dist
          cargo deb -p control --no-build --output "dist/control-${{ steps.version.outputs.version }}-amd64.deb"

      - name: AppImage
        run: |
          curl -fsSL -o /usr/local/bin/appimagetool https://github.com/AppImage/appimagetool/releases/download/continuous/appimagetool-x86_64.AppImage
          sudo chmod +x /usr/local/bin/appimagetool
          packaging/linux/appimage.sh "${{ steps.version.outputs.version }}" target/release/control dist

      - name: Fichiers générés
        run: ls -lh dist/

      - name: Envoyer l’AppImage
        uses: actions/upload-artifact@v6
        with:
          name: control-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Envoyer le paquet deb
        uses: actions/upload-artifact@v6
        with:
          name: control-deb
          path: dist/*.deb
          if-no-files-found: error

  # Serveur web : l'archive que la mise à jour automatique des serveurs télécharge (une par plateforme), signée si le
  # secret WEB_SIGNING_KEY existe (voir « Signer les mises à jour » dans le README).
  server:
    name: Serveur web — ${{ matrix.arch }}
    strategy:
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
          - arch: aarch64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6

      - name: Chaîne Rust (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install

      - uses: Swatinem/rust-cache@v2

      - name: Construire
        run: cargo build --release --locked -p control-server

      - name: Archive de mise à jour
        run: |
          target/release/control-server --bundle dist
          for f in dist/control-server-*.tgz; do
            if [ -n "$WEB_SIGNING_KEY" ]; then target/release/control-server --sign sign "$f"; else echo "Pas de clé de signature : $f non signée."; fi
          done
        env:
          WEB_SIGNING_KEY: ${{ secrets.WEB_SIGNING_KEY }}

      - name: Envoyer l’archive
        uses: actions/upload-artifact@v6
        with:
          name: control-server-${{ matrix.arch }}
          path: dist/control-server-*
          if-no-files-found: error

  # Image Docker du serveur (ghcr.io), publiée depuis la branche par défaut.
  docker:
    name: Image Docker
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Lire la version
        id: version
        run: echo "version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="control-server") | .version')" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        env:
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/control:latest
            ghcr.io/${{ github.repository_owner }}/control:${{ steps.version.outputs.version }}

  # Une release est publiée pour chaque tag v*, et sur la branche par défaut dès que la version n’a pas encore de release.
  release:
    name: Publier la release
    needs: [test, windows, linux, server]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lire la version
        id: version
        run: |
          version=$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name=="control") | .version')
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer les fichiers construits
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.tagged == 'false'
        uses: actions/download-artifact@v6
        with:
          path: dist
          pattern: control-*
          merge-multiple: true

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.tagged == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: control ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            dist/*-portable.exe
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
            dist/control-server-*.tgz
            dist/control-server-*.tgz.sig
          body: |
            ## Télécharger

            **Windows**
            - **`control-${{ steps.version.outputs.version }}-setup.exe`** : installateur (raccourcis Bureau et menu Démarrer, désinstallation propre).
            - **`control-${{ steps.version.outputs.version }}-portable.exe`** : version portable, rien à installer ; les réglages, la bibliothèque et les outils sont rangés dans un dossier `control data` à côté du fichier.

            **Linux (64 bits)**
            - **`control-${{ steps.version.outputs.version }}-x86_64.AppImage`** : un seul fichier, à rendre exécutable (`chmod +x`) puis à lancer ; il se met à jour tout seul.
            - **`control-${{ steps.version.outputs.version }}-amd64.deb`** : paquet pour Debian, Ubuntu et dérivés (`sudo apt install ./control-….deb`) ; une nouvelle version est signalée dans l’application.

            **Serveur web** : image Docker `ghcr.io/nildontsleep/control`. Les archives **`control-server-${{ steps.version.outputs.version }}-linux-*.tgz`** sont celles que la mise à jour automatique du serveur télécharge : il n’y a rien à en faire à la main.

            L’application n’est pas signée : au premier lancement, Windows SmartScreen peut afficher « Windows a protégé votre ordinateur ». Cliquez sur **Informations complémentaires**, puis **Exécuter quand même**.
