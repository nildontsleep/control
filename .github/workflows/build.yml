name: Build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Windows — portable + installateur
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l’exécutable portable et l’installateur
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Fichiers générés
        shell: pwsh
        run: Get-ChildItem dist -File | Format-Table Name, @{ n = 'Taille (Mo)'; e = { [math]::Round($_.Length / 1MB, 1) } }

      - name: Envoyer la version portable
        uses: actions/upload-artifact@v6
        with:
          name: control-portable
          path: dist/*-portable.exe
          if-no-files-found: error

      - name: Envoyer l’installateur
        uses: actions/upload-artifact@v6
        with:
          name: control-installateur
          path: dist/*-setup.exe
          if-no-files-found: error

  # Tests du serveur web (comptes, droits, médias, événements) sur une installation de production.
  web:
    name: Serveur web — tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci --omit=dev --ignore-scripts

      - name: Tests
        run: npm run test:web

  # Image Docker du serveur web, publiée sur la branche par défaut (ghcr.io/<propriétaire>/control).
  docker:
    name: Serveur web — image Docker
    needs: [web]
    runs-on: ubuntu-latest
    continue-on-error: true
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Lire la version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Construire et publier
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/control:latest
            ghcr.io/${{ github.repository_owner }}/control:${{ steps.version.outputs.version }}

  linux:
    name: Linux — AppImage + deb
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Construire l’AppImage et le paquet deb
        run: npm run dist:linux

      - name: Fichiers générés
        run: ls -lh dist/*.AppImage dist/*.deb

      - name: Envoyer l’AppImage
        uses: actions/upload-artifact@v6
        with:
          name: control-appimage
          path: dist/*.AppImage
          if-no-files-found: error

      - name: Envoyer le paquet deb
        uses: actions/upload-artifact@v6
        with:
          name: control-deb
          path: dist/*.deb
          if-no-files-found: error

  # Une release est publiée pour chaque tag v*, et sur la branche par défaut
  # dès que la version de package.json n’a pas encore de release.
  release:
    name: Publier la release
    needs: [windows, linux]
    runs-on: ubuntu-latest
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Lire la version
        id: version
        run: |
          version=$(node -p "require('./package.json').version")
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git rev-parse -q --verify "refs/tags/v$version" >/dev/null; then
            echo "tagged=true" >> "$GITHUB_OUTPUT"
          else
            echo "tagged=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Récupérer les fichiers construits
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.tagged == 'false'
        uses: actions/download-artifact@v6
        with:
          path: dist
          merge-multiple: true

      - name: Publier la release
        if: startsWith(github.ref, 'refs/tags/v') || steps.version.outputs.tagged == 'false'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || format('v{0}', steps.version.outputs.version) }}
          target_commitish: ${{ github.sha }}
          name: control ${{ steps.version.outputs.version }}
          make_latest: true
          files: |
            dist/*-portable.exe
            dist/*-setup.exe
            dist/*.AppImage
            dist/*.deb
          body: |
            ## Télécharger

            **Windows**
            - **`control-${{ steps.version.outputs.version }}-setup.exe`** : installateur (raccourcis Bureau et menu Démarrer, désinstallation propre).
            - **`control-${{ steps.version.outputs.version }}-portable.exe`** : version portable, rien à installer ; les réglages, la bibliothèque et les outils sont rangés dans un dossier `control data` à côté du fichier.

            **Linux (64 bits)**
            - **`control-${{ steps.version.outputs.version }}-x86_64.AppImage`** : un seul fichier, à rendre exécutable (`chmod +x`) puis à lancer ; il se met à jour tout seul. Demande FUSE 2 (`libfuse2`) sur Ubuntu récent, sinon : `./control-….AppImage --appimage-extract-and-run`.
            - **`control-${{ steps.version.outputs.version }}-amd64.deb`** : paquet pour Debian, Ubuntu et dérivés (`sudo apt install ./control-….deb`) ; une nouvelle version est signalée dans l’application, à télécharger à la main.

            L’application n’est pas signée : au premier lancement, Windows SmartScreen peut afficher « Windows a protégé votre ordinateur ». Cliquez sur **Informations complémentaires**, puis **Exécuter quand même**.
